name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov flake8 pylint mypy mkdocs

      - name: Static Analysis - flake8
        run: flake8 .|| true

      - name: Static Analysis - pylint
        run: pylint mkdocs_cdoc || true

      - name: Static Analysis - mypy
        run: mypy mkdocs_cdoc || true

      - name: Unit & Integration Tests
        run: pytest

      - name: Coverage Report
        run: pytest --cov=mkdocs_cdoc --cov-report=term

      - name: Build Validation
        run: mkdocs build
